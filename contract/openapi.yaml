              description: 资源版本；只对可更新资源有业务意义
              schema:
                type: string
                description: ''
        '400':
          description: 参数或格式错误
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 会话无效
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 缺少平台/操作权限
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 不存在或不可见
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 业务冲突/幂等键内容不一致
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '412':
          description: ETag 版本冲突
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 状态或引用规则不满足
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 限流
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 依赖服务不可用
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
