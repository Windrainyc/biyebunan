    StreamEvent:
      type: object
      additionalProperties: false
      properties:
        runId: *id010
        sequence: *id020
        type:
          type: string
          enum:
          - accepted
          - delta
          - citation
          - usage
          - completed
          - failed
          - cancelled
        data:
          type: object
          description: 按 type 使用下列 payload 类型
          oneOf:
          - $ref: '#/components/schemas/AcceptedPayload'
          - $ref: '#/components/schemas/DeltaPayload'
          - $ref: '#/components/schemas/CitationPayload'
          - $ref: '#/components/schemas/UsagePayload'
          - $ref: '#/components/schemas/TerminalPayload'
      required:
      - runId
      - sequence
      - type
      - data
      allOf:
      - if:
          properties:
            type:
              const: accepted
        then:
          properties:
            data:
              $ref: '#/components/schemas/AcceptedPayload'
      - if:
          properties:
            type:
              const: delta
        then:
          properties:
            data:
              $ref: '#/components/schemas/DeltaPayload'
      - if:
          properties:
            type:
              const: citation
        then:
          properties:
            data:
              $ref: '#/components/schemas/CitationPayload'
      - if:
          properties:
            type:
              const: usage
        then:
          properties:
            data:
              $ref: '#/components/schemas/UsagePayload'
      - if:
          properties:
            type:
              const: completed
        then:
          properties:
            data:
              $ref: '#/components/schemas/TerminalPayload'
      - if:
          properties:
            type:
              const: failed
        then:
          properties:
            data:
              $ref: '#/components/schemas/TerminalPayload'
      - if:
          properties:
            type:
              const: cancelled
        then:
          properties:
            data:
              $ref: '#/components/schemas/TerminalPayload'
