openapi: 3.1.0
info:
  title: 知项平台后端接口契约
  version: 1.0.4-development
  description: '评审契约，尚未实现。三端独立登录；服务端强制平台和对象权限。金额用十进制字符串。

    开发契约；含尚未实现接口，不代表已交付。实际状态见docs/开发进度.md。'
servers:
- url: https://api.example.com
  description: 占位地址；实际由三个站点同源反向代理
security:
- bearerAuth: []
tags:
- name: admin
  description: 管理员
- name: student
  description: 学生
- name: partner
  description: 项目中介
- name: auth
  description: 身份认证
- name: callback
  description: 验签回调
- name: health
  description: 内部健康检查
paths:
  /api/v1/admin/schools:
    get:
      operationId: get_admin_schools
      summary: 分页查询院校
      tags:
      - admin
      x-permission: schools:read
      x-data-scope: 按操作权限；私聊另需 chat:audit
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolPage'
        '400': &id001
          description: 参数或格式错误
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': &id002
          description: 会话无效
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '403': &id003
          description: 缺少平台/操作权限
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '404': &id004
          description: 不存在或不可见
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '409': &id005
          description: 业务冲突/幂等键内容不一致
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '412': &id006
          description: ETag 版本冲突
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '422': &id007
          description: 状态或引用规则不满足
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '429': &id008
          description: 限流
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '503': &id009
          description: 依赖服务不可用
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: page
        in: query
        required: false
        description: ''
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: size
        in: query
        required: false
        description: ''
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: q
        in: query
        required: false
        description: ''
        schema:
          type: string
          description: ''
          maxLength: 100
      - name: status
        in: query
        required: false
        description: 状态取值遵循返回资源定义；未知状态 400
        schema: &id011
          type: string
          description: ''
          maxLength: 200
      - name: sort
        in: query
        required: false
        description: 稳定排序附加 id 同序
        schema:
          type: string
          enum:
          - createdAt:desc
          - createdAt:asc
          - updatedAt:desc
      - name: X-Request-ID
        in: header
        required: false
        description: 可选关联 ID；服务端生成可信 traceId
        schema:
          type: string
          description: ''
          maxLength: 128
      x-filter-policy: q 匹配名称/标题/代码；status 按资源枚举；大小写及模糊匹配见接口设计。额外字段只有显式列出的可用。
    post:
      operationId: post_admin_schools
      summary: 新增院校
      tags:
      - admin
      x-permission: schools:write
      x-data-scope: 按操作权限；私聊另需 chat:audit
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/School'
          headers:
            ETag:
              description: 资源版本；只对可更新资源有业务意义
              schema:
                type: string
                description: ''
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '412': *id006
        '422': *id007
        '429': *id008
        '503': *id009
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: ''
        schema:
          type: string
          description: ''
          minLength: 16
          maxLength: 128
      - name: X-Request-ID
        in: header
        required: false
        description: 可选关联 ID；服务端生成可信 traceId
        schema:
          type: string
          description: ''
          maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchoolWrite'
