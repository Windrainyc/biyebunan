# 独立进程、无外网出口；仅供本机隔离API访问，浏览器不嵌入这个地址。
services:
  office:
    build: .
    image: zhixiang/kkfileview-private-office:5.0.3-zx1
    env_file: ../../secrets/office-preview.env
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=536870912,mode=1777
    mem_limit: 2g
    cpus: 2
    pids_limit: 192
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    networks: [conversion]
  gateway:
    image: nginxinc/nginx-unprivileged:stable-alpine@sha256:f5116ed4606f3eb015dd4a8e28cb9b351476dc0ad4bc6e9f93b19cec130cdf03
    entrypoint: [nginx, -g, "daemon off;"]
    volumes:
      - ./gateway.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:18790:8080"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    pids_limit: 32
    restart: unless-stopped
    depends_on: [office]
    networks: [conversion, ingress]
networks:
  ingress: {}
  conversion:
    internal: true
