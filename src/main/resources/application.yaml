spring:
  application:
    name: zhixiang-platform
  profiles:
    default: api
  datasource:
    url: ${ZX_DB_URL}
    username: ${ZX_DB_USER}
    password: ${ZX_DB_PASSWORD}
    hikari:
      maximum-pool-size: 8
      minimum-idle: 1
      connection-timeout: 5000
  flyway:
    enabled: false # 迁移由独立 migrate profile 执行，API 启动不修改数据库。
    default-schema: app
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  data:
    redis:
      host: ${ZX_REDIS_HOST}
      port: ${ZX_REDIS_PORT}
      username: ${ZX_REDIS_USER}
      password: ${ZX_REDIS_PASSWORD}
      timeout: 2s
  rabbitmq:
    host: ${ZX_RABBIT_HOST}
    port: ${ZX_RABBIT_PORT}
    username: ${ZX_RABBIT_USER}
    password: ${ZX_RABBIT_PASSWORD}
    virtual-host: ${ZX_RABBIT_VHOST}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10
  lifecycle:
    timeout-per-shutdown-phase: 30s
server:
  address: ${ZX_BIND_ADDRESS:127.0.0.1}
  port: ${ZX_PORT:18080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
management:
  tracing:
    export:
      otlp:
        enabled: ${ZX_OTLP_ENABLED:false}
    sampling:
      probability: ${ZX_TRACE_SAMPLE_RATE:0.1}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${ZX_OTLP_ENDPOINT:http://127.0.0.1:4318/v1/traces}
  otlp:
    metrics:
      export:
        enabled: false # 指标采用受保护Prometheus抓取，不重复外发。
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis,rabbit
mybatis:
  type-handlers-package: cn.zhixiang.platform.shared
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true

# 请求关联ID用于定位HTTP、业务错误与审计，禁止在日志中输出凭证。
logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-} traceId=%X{traceId:-} spanId=%X{spanId:-}]"
